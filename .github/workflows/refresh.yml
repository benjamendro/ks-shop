name: Daily price refresh

on:
  schedule:
    # 07:30 Asia/Amman (04:30 UTC) — after most Israeli chains publish morning files
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Over.org.il is reachable
        run: |
          python - << 'PY'
          import json, urllib.request
          url = "https://www.over.org.il/api/prices/stores?city=%D7%A7%D7%A8%D7%99%D7%AA%20%D7%A9%D7%9E%D7%95%D7%A0%D7%94&limit=1"
          req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "ks-shop-action/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read().decode())
          n = data.get("count") or len(data.get("stores") or [])
          print("Over reachable, sample store count:", n)
          PY
      - name: Build full Kiryat Shmona catalog from Over.org.il
        env:
          # Actions IPs are easily rate-limited by Over (HTTP 429). Go serial and paced.
          KS_SHOP_WORKERS: "1"
          KS_SHOP_MIN_INTERVAL: "0.5"
        run: python -u scripts/build_catalog.py
      - name: Commit updated data if changed
        run: |
          git config user.name "ks-shop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/meta.json web/data/products.json web/data/stats.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh Kiryat Shmona prices $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
